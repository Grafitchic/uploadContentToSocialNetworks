spring:
  application:
    name: uploadContentToSocialNetworks
  # Database
  datasource:
    url: jdbc:postgresql://${POSTGRES:localhost:5432}/${DB_NAME:uploadToSocialNetworks}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari.schema: ${DB_SCHEMA:application}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    property-naming-strategy: SNAKE_CASE
logging:
  level:
    # Рекомендуется указывать конкретный пакет клиента или интерфейс Feign
    it.project.uploadContentToSocialNetworks.feignclient: DEBUG
    # Альтернативно: можно включить логирование для всех клиентов Feign
    # feign.Logger: DEBUG
tiktok:
  url: https://www.tiktok.com/v2
  client-key: ${TIKTOK_CLIENT_KEY:sbawt0r9teolcl8z7r}
  client-secret: ${TIKTOK_CLIENT_SECRET:jKTxkVFRKIJcxGiiR4eQdWoH6sHJk1aU}
  redirect-uri: http://localhost:8080/oauth/callback/
  scopes:
    - user.info.basic
    - video.upload
    - video.publish
